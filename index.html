<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alanis | Noche de Máscaras</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #020202;
      }

      .invitation {
        width: min(768px, 100%);
        margin: 0 auto;
        display: block;
      }

      .invitation img {
        display: block;
        width: 100%;
        height: auto;
      }

      .rsvp-panel {
        position: relative;
      }

      .rsvp-button {
        position: absolute;
        top: 84.9%;
        left: 8%;
        width: 84%;
        height: 4.6%;
        border-radius: 999px;
      }

      .location-panel {
        position: relative;
      }

      .location-button {
        position: absolute;
        top: 35%;
        left: 10%;
        width: 80%;
        height: 3.6%;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="invitation">
      <img
        src="alanis/assets/images/invitacion1.png"
        alt="Alanis, Cristina Montero Pérez - Mis XV Años, Domingo 22 de Noviembre 2026"
      />
      <div class="location-panel">
        <img
          src="alanis/assets/images/invitacion2.png"
          alt="La celebración será en Jhanna Prestige Salón de Eventos, 6:00 P.M."
        />
        <a
          class="location-button"
          href="https://maps.app.goo.gl/GEi9rJCiLNvWMKEv6"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Ver ubicación"
        ></a>
      </div>
      <div class="rsvp-panel">
        <img
          src="alanis/assets/images/invitacion3.png"
          alt="Confirma tu asistencia antes del 8 de noviembre de 2026"
        />
        <a
          class="rsvp-button"
          href="https://forms.gle/iDB2rWCE6aH791Vv8"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Confirmar asistencia"
        ></a>
      </div>
    </div>
  </body>
</html>
